server {
  listen 80;
  server_name _;

  # Allow larger MRI uploads through the frontend reverse proxy.
  client_max_body_size 200M;

  root /usr/share/nginx/html;
  index index.html;

  # Critical PWA files: must NEVER be cached so service worker detects updates
  location ~* ^/(ngsw\.json|ngsw-worker\.js|index\.html|manifest\.webmanifest|site\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets (JS/CSS chunks with content hash in filename) – safe to cache a long time
  location ~* "\.[0-9a-f]{8,}\.(js|css|mjs)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Other static assets (images, fonts, icons)
  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # Angular SPA routing (catch-all)
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy API calls to .NET backend container
  location /api/ {
    proxy_pass http://api:80/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
