<div
  class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6"
>
  <div class="max-w-4xl mx-auto">
    <div class="glass-card p-8">
      <h1 class="text-3xl font-bold text-white mb-2">{{ title() }}</h1>
      <p class="text-gray-400 mb-6">{{ subtitle() }}</p>

      <div class="space-y-5">
        <section
          *ngFor="let section of sections()"
          class="rounded-xl border border-slate-700 p-4 bg-slate-900/60"
        >
          <h2 class="text-lg font-semibold text-cyan-300 mb-2">
            {{ section.heading }}
          </h2>
          <p class="text-gray-300 leading-relaxed">{{ section.body }}</p>
        </section>
      </div>

      <div class="mt-8">
        <a
          routerLink="/home"
          class="inline-flex px-5 py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold"
          >Back to Home</a
        >
      </div>
    </div>
  </div>
</div>
