<div
  class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6"
>
  <div class="max-w-4xl mx-auto">
    <div class="glass-card p-8">
      <div class="mb-7 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-3xl font-bold text-white mb-2">{{ title() }}</h1>
          <p class="text-gray-400">{{ subtitle() }}</p>
        </div>
        <div class="text-xs uppercase tracking-[0.12em] text-cyan-300/80">
          Updated {{ lastUpdated }}
        </div>
      </div>

      <div
        *ngIf="quickActions().length"
        class="mb-7 rounded-xl border border-cyan-800/70 bg-slate-900/60 p-4"
      >
        <h2
          class="text-sm font-semibold uppercase tracking-[0.1em] text-cyan-300 mb-3"
        >
          Quick Access
        </h2>
        <div class="grid gap-2 sm:grid-cols-3">
          <div
            *ngFor="let action of quickActions()"
            class="rounded-lg border border-slate-700 bg-slate-900/80 p-3"
          >
            <p class="text-[0.7rem] uppercase tracking-[0.1em] text-slate-400">
              {{ action.label }}
            </p>
            <p class="mt-1 text-sm font-semibold text-white break-all">
              {{ action.value }}
            </p>
          </div>
        </div>
      </div>

      <div class="space-y-5">
        <section
          *ngFor="let section of sections()"
          class="rounded-xl border border-slate-700 p-4 bg-slate-900/60"
        >
          <h2 class="text-lg font-semibold text-cyan-300 mb-2">
            {{ section.heading }}
          </h2>
          <p class="text-gray-300 leading-relaxed">{{ section.body }}</p>

          <ul *ngIf="section.bullets?.length" class="mt-3 space-y-2">
            <li
              *ngFor="let point of section.bullets"
              class="text-sm text-slate-300 leading-relaxed flex gap-2"
            >
              <span
                class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-cyan-300"
              ></span>
              <span>{{ point }}</span>
            </li>
          </ul>
        </section>
      </div>

      <div class="mt-8">
        <a
          routerLink="/home"
          class="inline-flex px-5 py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold"
          >Back to Home</a
        >
      </div>
    </div>
  </div>
</div>
