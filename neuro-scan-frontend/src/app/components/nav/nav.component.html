<nav class="glass-card fixed top-0 left-0 right-0 z-50 m-4 animate-slide-down">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo - Far Left -->
      <div class="flex-shrink-0">
        <h1 class="text-2xl font-bold glow-text">
          <span class="text-cyan-400">Neuro</span
          ><span class="text-teal-400">Scan</span>
        </h1>
      </div>

      <!-- Right Side: Navigation + User Profile -->
      <div class="flex items-center space-x-6">
        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-baseline space-x-4">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-white/20 text-cyan-400"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="closeMenus()"
            class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-cyan-400 transition-all duration-300"
          >
            <svg
              class="inline w-5 h-5 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              ></path>
            </svg>
            Dashboard
          </a>
          <a
            *ngIf="isDoctor()"
            routerLink="/patients"
            routerLinkActive="bg-white/20 text-cyan-400"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="closeMenus()"
            class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-cyan-400 transition-all duration-300"
          >
            <svg
              class="inline w-5 h-5 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
              ></path>
            </svg>
            Patients
          </a>
        </div>

        <!-- User Profile -->
        <div class="relative">
          <button
            (click)="toggleProfile()"
            class="flex items-center space-x-3 px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 transition-all duration-300 border border-white/10 hover:border-cyan-400/50"
          >
            <div
              class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-500 to-teal-500 flex items-center justify-center text-white font-semibold text-sm"
            >
              {{ getUserInitials() }}
            </div>
            <div class="text-left">
              <p class="text-sm font-medium text-white">
                {{ currentUser?.firstName }} {{ currentUser?.lastName }}
              </p>
              <p class="text-xs text-gray-400">{{ getUserRole() }}</p>
            </div>
            <svg
              class="w-4 h-4 text-gray-400 transition-transform duration-300"
              [class.rotate-180]="isProfileOpen"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          <!-- Profile Dropdown -->
          <div
            *ngIf="isProfileOpen"
            class="absolute right-0 mt-2 w-56 glass-card rounded-xl shadow-lg overflow-hidden animate-slide-up"
          >
            <div class="px-4 py-3 border-b border-white/10">
              <p class="text-sm text-gray-400">Signed in as</p>
              <p class="text-sm font-medium text-white truncate">
                {{ currentUser?.email }}
              </p>
            </div>
            <button
              (click)="logout()"
              class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/10 transition-all duration-300 flex items-center space-x-2"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                ></path>
              </svg>
              <span>Sign out</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button
          (click)="toggleMenu()"
          class="inline-flex items-center justify-center p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition-all duration-300"
        >
          <svg
            class="h-6 w-6"
            [class.hidden]="isMenuOpen"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
          <svg
            class="h-6 w-6"
            [class.hidden]="!isMenuOpen"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="md:hidden" [class.hidden]="!isMenuOpen">
    <div class="px-2 pt-2 pb-3 space-y-1 border-t border-white/10 mt-2">
      <!-- User Info -->
      <div class="px-3 py-3 mb-3 rounded-lg bg-white/5 border border-white/10">
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-500 to-teal-500 flex items-center justify-center text-white font-semibold"
          >
            {{ getUserInitials() }}
          </div>
          <div>
            <p class="text-sm font-medium text-white">
              {{ currentUser?.firstName }} {{ currentUser?.lastName }}
            </p>
            <p class="text-xs text-gray-400">{{ currentUser?.email }}</p>
            <p class="text-xs text-cyan-400 mt-1">{{ getUserRole() }}</p>
          </div>
        </div>
      </div>

      <!-- Navigation Links -->
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-white/20 text-cyan-400"
        (click)="closeMenus()"
        class="block px-3 py-2 rounded-lg text-base font-medium text-gray-300 hover:bg-white/10 hover:text-cyan-400 transition-all duration-300"
      >
        <svg
          class="inline w-5 h-5 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          ></path>
        </svg>
        Dashboard
      </a>
      <a
        *ngIf="isDoctor()"
        routerLink="/patients"
        routerLinkActive="bg-white/20 text-cyan-400"
        (click)="closeMenus()"
        class="block px-3 py-2 rounded-lg text-base font-medium text-gray-300 hover:bg-white/10 hover:text-cyan-400 transition-all duration-300"
      >
        <svg
          class="inline w-5 h-5 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
          ></path>
        </svg>
        Patients
      </a>

      <!-- Logout -->
      <button
        (click)="logout()"
        class="w-full text-left px-3 py-2 rounded-lg text-base font-medium text-red-400 hover:bg-white/10 transition-all duration-300 flex items-center"
      >
        <svg
          class="w-5 h-5 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          ></path>
        </svg>
        Sign out
      </button>
    </div>
  </div>
</nav>
