<div class="ns-auth min-h-screen flex items-center justify-center p-6">
  <!-- Static decorative background: organic shapes + frosted logo behind glass -->
  <div class="ns-auth-decor" aria-hidden="true">
    <img src="/logo-transparent.png" alt="" class="ns-auth-logo" />
    <span class="ns-auth-shape ns-auth-shape-1"></span>
    <span class="ns-auth-shape ns-auth-shape-2"></span>
    <span class="ns-auth-shape ns-auth-shape-3"></span>
  </div>

  <!-- Register Card -->
  <div class="relative z-10 glass-card p-8 md:p-10 w-full max-w-lg">
    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img
        src="/logo-transparent.png"
        alt="NeuroScan"
        class="w-20 h-20 drop-shadow-[0_0_22px_rgba(34,165,233,0.45)]"
      />
    </div>

    <!-- Heading -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Create Account</h1>
      <p class="text-sm text-gray-400 mt-1">
        Join NeuroScan Medical Imaging Platform
      </p>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage()"
      class="mb-5 p-3 rounded-xl bg-red-500/15 border border-red-500/40"
    >
      <div class="flex items-center space-x-2">
        <svg
          class="w-5 h-5 text-red-400 flex-shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <p class="text-red-300 text-sm">{{ errorMessage() }}</p>
      </div>
    </div>

    <!-- Registration Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Name Fields (Side by Side) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label
            for="firstName"
            class="block text-sm font-medium text-gray-300 mb-1.5"
            >First Name</label
          >
          <input
            type="text"
            id="firstName"
            name="firstName"
            [(ngModel)]="registerRequest.firstName"
            required
            class="w-full px-4 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
            placeholder="John"
            [disabled]="isLoading()"
          />
        </div>

        <div>
          <label
            for="lastName"
            class="block text-sm font-medium text-gray-300 mb-1.5"
            >Last Name</label
          >
          <input
            type="text"
            id="lastName"
            name="lastName"
            [(ngModel)]="registerRequest.lastName"
            required
            class="w-full px-4 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
            placeholder="Doe"
            [disabled]="isLoading()"
          />
        </div>
      </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5"
          >Email</label
        >
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="registerRequest.email"
          required
          class="w-full px-4 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
          placeholder="doctor@neuroscan.com"
          [disabled]="isLoading()"
        />
      </div>

      <!-- Password Fields -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-300 mb-1.5"
            >Password</label
          >
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="registerRequest.password"
              required
              class="w-full px-4 pr-12 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
              placeholder="••••••••"
              [disabled]="isLoading()"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-cyan-400 transition-colors"
            >
              <svg
                *ngIf="!showPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                ></path>
              </svg>
              <svg
                *ngIf="showPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label
            for="confirmPassword"
            class="block text-sm font-medium text-gray-300 mb-1.5"
            >Confirm Password</label
          >
          <div class="relative">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              class="w-full px-4 pr-12 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
              placeholder="••••••••"
              [disabled]="isLoading()"
            />
            <button
              type="button"
              (click)="toggleConfirmPassword()"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-cyan-400 transition-colors"
            >
              <svg
                *ngIf="!showConfirmPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                ></path>
              </svg>
              <svg
                *ngIf="showConfirmPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Doctor Invite Code (Standard Users only) -->
      <div *ngIf="registerRequest.role === UserRole.StandardUser">
        <label
          for="inviteCode"
          class="block text-sm font-medium text-gray-300 mb-1.5"
        >
          Doctor Invite Code
          <span class="text-gray-500 font-normal">(optional)</span>
        </label>
        <input
          type="text"
          id="inviteCode"
          name="inviteCode"
          [(ngModel)]="registerRequest.inviteCode"
          class="w-full px-4 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all uppercase tracking-widest"
          placeholder="DR-XXXXXXXX"
          [disabled]="isLoading()"
          maxlength="11"
        />
        <p class="mt-1 text-xs text-gray-500">
          Enter the code provided by your doctor to link your account.
        </p>
      </div>

      <!-- Terms & Conditions -->
      <div class="flex items-start space-x-3">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          [(ngModel)]="acceptedTerms"
          class="mt-1 w-4 h-4 rounded border-2 border-cyan-500/50 bg-slate-700/70 text-cyan-500 focus:ring-2 focus:ring-cyan-500 focus:ring-offset-0"
        />
        <label for="terms" class="text-sm text-gray-300">
          I agree to the
          <a
            routerLink="/terms"
            target="_blank"
            class="text-cyan-400 hover:text-cyan-300"
            >Terms of Service</a
          >
          and
          <a
            routerLink="/privacy"
            target="_blank"
            class="text-cyan-400 hover:text-cyan-300"
            >Privacy Policy</a
          >
        </label>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading() || !acceptedTerms"
        class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-teal-500 text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-cyan-500/30 hover:brightness-110 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading()">Create Account</span>
        <span *ngIf="isLoading()" class="flex items-center justify-center">
          <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Creating account...
        </span>
      </button>
    </form>

    <!-- Login Link -->
    <div class="mt-6 text-center">
      <p class="text-gray-400 text-sm">
        Already have an account?
        <a
          routerLink="/login"
          class="text-cyan-400 hover:text-cyan-300 font-semibold transition-colors ml-1"
        >
          Sign in here
        </a>
      </p>
    </div>

    <!-- Footer -->
    <div class="mt-6 pt-5 border-t border-slate-700/70">
      <p class="text-center text-xs text-gray-600">
        © 2026 NeuroScan · v{{ appVersion }}
      </p>
    </div>
  </div>
</div>
