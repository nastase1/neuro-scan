<div
  class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-6"
>
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"
    ></div>
    <div
      class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl"
    ></div>
  </div>

  <!-- Login Card -->
  <div class="relative glass-card p-8 md:p-12 w-full max-w-md">
    <!-- Logo & Header -->
    <div class="text-center mb-8">
      <div class="mb-4">
        <img
          src="/logo-transparent.png"
          alt="NeuroScan"
          class="w-28 h-28 mx-auto drop-shadow-[0_0_24px_rgba(14,165,233,0.55)]"
        />
      </div>
      <h1 class="text-3xl font-bold text-white mb-2 glow-text">Welcome</h1>
      <p class="text-gray-400">Sign in to NeuroScan Medical Imaging</p>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage()"
      class="mb-6 p-4 glass-card bg-red-500/20 border-red-500/50 rounded-xl animate-fade-in"
    >
      <div class="flex items-center space-x-3">
        <svg
          class="w-5 h-5 text-red-400 flex-shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <p class="text-red-300 text-sm">{{ errorMessage() }}</p>
      </div>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email Field -->
      <div>
        <label
          for="email"
          class="block text-sm font-semibold text-gray-300 mb-2"
          >Email Address</label
        >
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
          >
            <svg
              class="w-5 h-5 text-cyan-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
              ></path>
            </svg>
          </div>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="loginRequest.email"
            required
            class="w-full pl-12 pr-4 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
            placeholder="doctor@neuroscan.com"
            [disabled]="isLoading()"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label
          for="password"
          class="block text-sm font-semibold text-gray-300 mb-2"
          >Password</label
        >
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
          >
            <svg
              class="w-5 h-5 text-cyan-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              ></path>
            </svg>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="loginRequest.password"
            required
            class="w-full pl-12 pr-12 py-3 glass-card text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
            placeholder="••••••••"
            [disabled]="isLoading()"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-cyan-400 transition-colors"
          >
            <svg
              *ngIf="!showPassword"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              ></path>
            </svg>
            <svg
              *ngIf="showPassword"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember & Forgot -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center cursor-pointer">
          <input
            type="checkbox"
            class="w-4 h-4 rounded border-2 border-cyan-500/50 bg-slate-700/70 text-cyan-500 focus:ring-2 focus:ring-cyan-500 focus:ring-offset-0"
          />
          <span class="ml-2 text-gray-300">Remember me</span>
        </label>
        <a
          routerLink="/forgot-password"
          class="text-cyan-400 hover:text-cyan-300 transition-colors"
          >Forgot password?</a
        >
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full py-4 bg-gradient-to-r from-cyan-500 to-teal-500 text-white font-bold rounded-xl hover:shadow-lg hover:shadow-cyan-500/30 hover:brightness-110 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading()" class="flex items-center justify-center">
          Sign In
          <svg
            class="w-5 h-5 ml-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            ></path>
          </svg>
        </span>
        <span *ngIf="isLoading()" class="flex items-center justify-center">
          <svg
            class="animate-spin h-5 w-5 mr-3"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Signing in...
        </span>
      </button>
    </form>

    <!-- Google Login -->
    <div class="mt-6">
      <div class="relative flex items-center my-4">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="mx-3 text-xs text-gray-500">or continue with</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>
      <div class="w-full rounded-xl overflow-hidden">
        <div #googleBtn class="w-full"></div>
      </div>
    </div>

    <!-- Register Link -->
    <div class="mt-8 text-center">
      <p class="text-gray-400 text-sm">
        Don't have an account?
        <a
          routerLink="/register"
          class="text-cyan-400 hover:text-cyan-300 font-semibold transition-colors ml-1"
        >
          Create one here
        </a>
      </p>
    </div>

    <!-- Divider -->
    <div class="mt-8 pt-8 border-t border-slate-700">
      <p class="text-center text-xs text-gray-500">
        © 2026 NeuroScan. Medical-grade AI imaging platform.
      </p>
      <p class="text-center text-xs text-gray-600 mt-1">v{{ appVersion }}</p>
    </div>
  </div>
</div>
